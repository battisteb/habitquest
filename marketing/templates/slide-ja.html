<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet" />
<style>
  /* Japanese account (kawaii): Pip speaks in a pixel speech bubble on sakura pastels. */
  :root {
    --ink: #14142a; --pink: #ff8fc8; --pink-dark: #d65a97; --cream: #fff6e9; --sakura: #ffe3ee;
    --muted: #8a6f86; --accent: #ff5a8a;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: 'M PLUS Rounded 1c', sans-serif; color: var(--ink);
    background: linear-gradient(170deg, var(--sakura) 0%, var(--cream) 70%);
    display: flex; flex-direction: column; padding: 70px 76px 60px; position: relative;
  }
  /* soft pixel dots */
  body::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .18;
    background-image: radial-gradient(var(--pink) 3px, transparent 3px);
    background-size: 48px 48px;
  }
  .top { display: flex; align-items: center; gap: 16px; font-family: 'DotGothic16'; font-size: 30px; color: var(--muted); z-index: 1; }
  .top img { width: 60px; height: 60px; image-rendering: pixelated; }
  .counter { margin-left: auto; font-size: 26px; }
  .content { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px; z-index: 1; }
  .bubble {
    position: relative; background: #fff; border: 6px solid var(--ink); padding: 40px 44px;
    box-shadow: 10px 10px 0 var(--pink-dark);
  }
  .bubble::after { /* pixel tail towards Pip */
    content: ''; position: absolute; left: 90px; bottom: -40px; width: 40px; height: 40px;
    background: #fff; border-left: 6px solid var(--ink); border-bottom: 6px solid var(--ink);
    transform: skewY(-40deg); transform-origin: top left;
  }
  h1 { font-family: 'DotGothic16'; font-size: 66px; line-height: 1.35; }
  h1 em { font-style: normal; color: var(--accent); }
  /* Japanese: balanced lines, and no break inside a highlighted word. */
  h1, p.body { text-wrap: balance; line-break: strict; }
  h1 em, p.body b, .nw { white-space: nowrap; }
  p.body { font-size: 38px; line-height: 1.6; font-weight: 500; margin-top: 18px; color: #3d2f45; }
  p.body b { color: var(--accent); font-weight: 800; }
  .pip { width: 300px; height: 300px; image-rendering: pixelated; margin-left: 30px; }
  .pips { display: flex; justify-content: space-between; margin-top: 10px; }
  .pips figure { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pips img { width: 160px; height: 160px; image-rendering: pixelated; }
  .pips figcaption { font-family: 'DotGothic16'; font-size: 30px; }
  .row { display: flex; gap: 40px; align-items: flex-end; }
  .row .left { flex: 1; display: flex; flex-direction: column; gap: 30px; }
  .row h1 { font-size: 50px; }
  .row p.body { font-size: 32px; }
  .row .pip { width: 220px; height: 220px; margin-left: 10px; }
  .phone { width: 400px; flex: none; padding: 12px; background: var(--ink); border: 6px solid var(--ink); box-shadow: 12px 12px 0 var(--pink); }
  .phone img { width: 100%; display: block; }
  .cta {
    align-self: flex-start; font-family: 'DotGothic16'; font-size: 40px; padding: 22px 36px; color: #fff;
    background: var(--accent); border: 6px solid var(--ink); box-shadow: 8px 8px 0 var(--pink-dark);
  }
  .footer { display: flex; justify-content: space-between; align-items: center; font-size: 28px; color: var(--muted); font-weight: 800; z-index: 1; }
  .swipe { font-family: 'DotGothic16'; font-size: 30px; color: var(--accent); }
</style>
</head>
<body>
  <div class="top"><img src="../brand/pip/pip-joy-love.png" alt="" /><span>HabitQuest</span><span class="counter" id="counter"></span></div>
  <div class="content" id="content"></div>
  <div class="footer"><span>@habitquest.app</span><span class="swipe" id="swipe"></span></div>
<script>
  // Filled by render-posts.js (LANG=ja):
  // window.render({ pip, title, body, image, pips, cta, index, total, screens })
  const pipImg = (key, cls = 'pip') => `<img class="${cls}" src="../brand/pip/pip-${key}.png" alt="" />`;
  window.render = (s) => {
    document.getElementById('counter').textContent = s.total > 1 ? `${s.index}/${s.total}` : '';
    document.getElementById('swipe').textContent = s.index < s.total ? 'スワイプ ▶' : '';
    const bubble = `<div class="bubble"><h1>${s.title}</h1>${s.body ? `<p class="body">${s.body}</p>` : ''}</div>`;
    const pips = s.pips
      ? `<div class="pips">${s.pips.map((p) => `<figure>${pipImg(p.pip, '')}<figcaption>${p.label}</figcaption></figure>`).join('')}</div>`
      : '';
    const cta = s.cta ? `<div class="cta">${s.cta}</div>` : '';
    const c = document.getElementById('content');
    c.innerHTML = s.image
      ? `<div class="row"><div class="left">${bubble}${s.pip ? pipImg(s.pip) : ''}</div>
           <div class="phone"><img src="../assets/${s.screens}/${s.image}.png" /></div></div>${cta}`
      : `${bubble}${pips}${s.pip && !s.pips ? pipImg(s.pip) : ''}${cta}`;
  };
</script>
</body>
</html>
