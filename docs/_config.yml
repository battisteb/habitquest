# GitHub Pages (Settings → Pages → Deploy from branch: main /docs)
title: HabitQuest
description: Level up your habits — a pixel art RPG habit tracker.
theme: jekyll-theme-minimal
lang: en
# Languages of the public pages (privacy-policy, privacy-policy.fr, privacy-policy.ja…).
langs: [en, fr, ja]
# Internal project docs stay in the repo but are not published on the site.
exclude:
  - adr/
  - app-store/
  - play-store/
  - game-design/
  - review/
  - support-messages.md
  - auth-emails.md
  - web-testing.md
  - ux-review.md
